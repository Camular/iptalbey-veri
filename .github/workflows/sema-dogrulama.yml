# Katalog dosyalarının şema ve referans doğrulaması (sır kullanmaz, salt okunur).
name: Şema doğrulama

on:
  pull_request:
    paths:
      - fiyatlar.json
      - iptal-rehberleri.json
      - sema/**
      - scripts/sema_dogrula.py
  push:
    branches: [main]
    paths:
      - fiyatlar.json
      - iptal-rehberleri.json
      - sema/**
      - scripts/sema_dogrula.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogrula:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7.0.1

      - name: Python kur
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları kur
        run: python -m pip install -r requirements.txt

      - name: Şemayı doğrula
        run: python scripts/sema_dogrula.py
